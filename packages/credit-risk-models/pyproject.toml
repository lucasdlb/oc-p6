[project]
name = "credit-risk-models"
version = "0.1.0"
description = "Credit risk model pipeline — inference-ready estimator and pipeline classes"
requires-python = ">=3.12"
dependencies = [
    "credit-risk-processing",
    "polars>=1.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.uv.sources]
credit-risk-processing = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_models"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
