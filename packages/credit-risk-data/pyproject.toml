[project]
name = "credit-risk-data"
version = "0.1.0"
description = "Credit risk data loaders — Polars and Pandas CSV loaders for Home Credit tables"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
