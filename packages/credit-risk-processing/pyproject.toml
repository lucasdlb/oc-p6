[project]
name = "credit-risk-processing"
version = "0.1.0"
description = "Credit risk feature engineering — shared processing steps"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "ty>=0.0.24",
    { include-group = "test" },
]
test = [
    "pytest>=9.0.2",
    "oc-p6",
]

[tool.uv.sources]
oc-p6 = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk_processing"]

[tool.pytest.ini_options]
testpaths = ["processing_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
