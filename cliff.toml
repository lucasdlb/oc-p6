# cliff.toml — git-cliff configuration for oc-p6
# Generates a CHANGELOG.md grouped by conventional-commit type, excluding
# merge commits and version-bump chore commits from the rendered output.

[changelog]
header = """
# Changelog\n
All notable changes to the credit-risk packages are documented here.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}\
    {% endfor %}
{% endfor %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
require_conventional_branches = false

# Split commits on conventional-commit type
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^chore: bump packages", skip = true },
    { message = "^chore", group = "Miscellaneous" },
    { message = "^ci", group = "CI/CD" },
    { message = "^style", group = "Styling" },
    { message = "^revert", group = "Reverts" },
]
filter_commits = true
tag_pattern = "credit-risk-data/v[0-9].*"
sort_commits = "newest"
