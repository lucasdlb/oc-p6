[project]
name = "oc-p6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "pytest-coverage>=0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
"""

# -------------------------
# Coverage configuration
# -------------------------
[tool.coverage.run]
branch = true # measure branch coverage (better than line coverage)
source = ["src"]

[tool.coverage.report]
#fail_under = 90
show_missing = true # display uncovered lines
skip_covered = true # hide fully covered files

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []
