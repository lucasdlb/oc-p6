[project]
name = "oc-p6"
version = "0.1.0"
description = "Credit Risk ML POC - Predicting credit default"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.0.0",
    "mlflow>=3.0.0",
    "shap>=0.45.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "optuna>=3.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = """
    --cov=src
    --cov-report=term-missing
    --cov-report=xml
    --cov-report=html
"""

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
