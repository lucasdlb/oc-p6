[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
credit-risk-processing = { workspace = true }
credit-risk-models = { workspace = true }
credit-risk-data = { workspace = true }

[project]
name = "oc-p6"
version = "0.1.0"
description = "Credit Risk ML POC - Predicting credit default"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "credit-risk-processing",
    "credit-risk-models",
    "credit-risk-data",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.5.0",
    "lightgbm>=4.0.0",
    "mlflow>=3.11.1",
    "shap>=0.45.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "optuna>=3.0.0",
    "imbalanced-learn>=0.12.0",
    "xgboost>=3.2.0",
    "catboost>=1.2.10",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/credit-risk-processing/processing_tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
