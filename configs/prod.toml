# Prod mode - full execution
# Usage: uv run python scripts/rfe_cv_all.py (defaults to prod)

[run]
mode = "prod"
sample_fraction = 1.0
random_state = 42

[splitter]
test_size = 0.2
n_splits = 5
random_state = 42

[model]
max_depth = 5
n_estimators = 500
learning_rate = 0.02
num_leaves = 31
min_child_samples = 20
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 0.1
n_jobs = -1
class_weight = "balanced"
verbose = -1

[selection]
min_features = 20
tolerance = 0.005
nb_remove_features = 0.3

[importance]
method = "inner"

[mlflow]
enabled = true
experiment_name = "all_tables_rfe_cv"

[search]
preset = "fast"
max_grid_values = 3

[tuning]
n_trials = 30
timeout = 7200
study_name = "prod_tuning"
direction = "maximize"
n_jobs = 1
pruner = "median"
models = [
    "lgbm",
#    "random_forest",
    "hist_gbm",
#    "lr"
]

[enabled_tables]
application = true
bureau = true
bureau_balance = true
previous_application = true
pos_cash_balance = true
installments_payments = true
credit_card_balance = true

[resampling]
enabled = false
method = "under"
sampling_strategy = 3.0
k_neighbors = 5
random_state = 42
