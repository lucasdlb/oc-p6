# Prod mode - full execution

[run]
mode = "prod"
sample_fraction = 1.0
random_state = 42

[splitter]
test_size = 0.2
n_splits = 5
cv_random_state = 42
test_random_state = 42
stratify = true
shuffle = true

[model]
model_type = "lgbm"
x_transform = "none"

[model.params]
max_depth = 5
n_estimators = 500
learning_rate = 0.02
num_leaves = 31
min_child_samples = 20
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 0.1
n_jobs = -1
class_weight = "balanced"
verbose = -1

[selection]
min_features = 20
tolerance = 0.005
nb_remove_features = 0.3

[importance]
method = "inner"

[tuning]
n_trials = 5
timeout = 7200
study_name = "prod_tuning"
direction = "maximize"
n_jobs = 1
pruner = "median"
models = [
    "lgbm",
    "hist_gbm",
]
x_transform = "none"

[resampling]
enabled = false
method = "under"
sampling_strategy = 3.0
k_neighbors = 5
random_state = 42
