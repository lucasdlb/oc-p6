data:
  target_column: TARGET
  id_column: SK_ID_CURR
  test_id_column: SK_ID_CURR
  categorical_threshold: 10
  train_size: 0.8

features:
  bureau_agg_features:
    - SK_ID_BUREAU
    - DAYS_CREDIT
    - CREDIT_DAY_OVERDUE
    - CNT_CREDIT_PROLONG
    - AMT_CREDIT_SUM_OVERDUE
    - AMT_CREDIT_SUM
    - AMT_ANNUITY
  previous_app_agg_features:
    - SK_ID_PREV
    - AMT_ANNUITY
    - AMT_APPLICATION
    - AMT_CREDIT
    - AMT_DOWN_PAYMENT
    - DAYS_DECISION
    - CNT_PAYMENT
  installments_agg_features:
    - NUM_INSTALMENT_NUMBER
    - NUM_INSTALMENT_VERSION
    - AMT_INSTALMENT
    - AMT_PAYMENT
  pos_cash_agg_features:
    - MONTHS_BALANCE
    - CNT_INSTALMENT
    - CNT_INSTALMENT_FUTURE
    - SK_DPD
    - SK_DPD_DEF
  credit_card_agg_features:
    - MONTHS_BALANCE
    - AMT_BALANCE
    - AMT_CREDIT_LIMIT_ACTUAL
    - AMT_DRAWINGS_ATM_CURRENT
    - AMT_DRAWINGS_CURRENT
    - AMT_DRAWINGS_OTHER_CURRENT
    - AMT_DRAWINGS_POS_CURRENT
    - AMT_INST_MIN_REGULARITY
    - AMT_PAYMENT_CURRENT
    - AMT_PAYMENT_TOTAL_CURRENT
    - AMT_RECEIVABLE_PRINCIPAL
    - AMT_RECIVABLE
    - AMT_TOTAL_RECEIVABLE
    - CNT_DRAWINGS_ATM_CURRENT
    - CNT_DRAWINGS_CURRENT
    - CNT_DRAWINGS_OTHER_CURRENT
    - CNT_DRAWINGS_POS_CURRENT
    - CNT_INSTALMENT_MATURE_CUM
    - SK_DPD
    - SK_DPD_DEF
  bureau_balance_agg_features:
    - MONTHS_BALANCE
    - STATUS

model:
  model_type: lightgbm
  n_estimators: 1000
  learning_rate: 0.05
  max_depth: 8
  num_leaves: 31
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  n_jobs: -1
  early_stopping_rounds: 100

interpret:
  shap_background_samples: 1000
  shap_n_samples: 100

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
