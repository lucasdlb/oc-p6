# Debug mode - fast execution with small sample

[run]
mode = "debug"
sample_fraction = 0.05

[splitter]
test_size = 0.8
n_splits = 2
cv_random_state = 42
test_random_state = 42
stratify = true
shuffle = true

[model]
model_type = "lgbm"
x_transform = "none"

[model.params]
max_depth = 3
n_estimators = 50
learning_rate = 0.05
num_leaves = 31
min_child_samples = 20
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.1
reg_lambda = 0.1
random_state = 42
n_jobs = -1
class_weight = "balanced"
verbose = -1

[selection]
min_features = 20
tolerance = 0.005
nb_remove_features = 0.3

[importance]
method = "inner"

[interpret]
shap_background_samples = 100
shap_n_samples = 50

[tuning]
n_trials = 2
timeout = 300
study_name = "debug_tuning"
direction = "maximize"
n_jobs = 1
pruner = "median"
models = ["lgbm"]

[resampling]
enabled = false
method = "smote"
sampling_strategy = "minority"
k_neighbors = 5
random_state = 42
